<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Sign in · NSAI for Insurance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0F1419;
    --ink-2: #2A3340;
    --paper: #F4EFE6;
    --paper-2: #ECE5D6;
    --rule: #1C2530;
    --accent: #B8442E;     /* terracotta */
    --accent-3: #C8A951;   /* brass */
    --muted: #6B6458;
    --soft: #D9D1BF;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter Tight', -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  .wrap { width: 100%; max-width: 1080px; margin: 0 auto; padding: 0 32px; }

  /* Nav — mirrors the homepage */
  .nav { border-bottom: 1px solid rgba(28,37,48,0.12); }
  .nav-inner { display: flex; align-items: center; min-height: 64px; }
  .nav-brand {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 17px;
    color: var(--ink);
    display: flex;
    align-items: center;
  }
  .nav-brand .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--accent);
    display: inline-block; margin-right: 10px;
  }
  .nav-sub { font-weight: 400; font-size: 14px; color: var(--muted); }

  /* Hero / login */
  main { flex: 1; display: flex; align-items: center; }
  .hero { width: 100%; padding: 56px 0 72px; }
  .hero-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    display: flex; align-items: center;
    margin-bottom: 22px;
  }
  .hero-eyebrow::before {
    content: ''; width: 26px; height: 2px;
    background: var(--accent); margin-right: 12px;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-size: clamp(40px, 6vw, 68px);
    line-height: 1.02;
    letter-spacing: -0.02em;
    color: var(--ink);
    margin: 0 0 20px;
  }
  h1 em { font-style: italic; color: var(--accent); }
  .lede {
    font-size: 18px;
    line-height: 1.6;
    color: var(--ink-2);
    max-width: 46ch;
    margin: 0 0 40px;
  }

  .card {
    background: var(--paper-2);
    border: 1px solid rgba(28,37,48,0.14);
    border-radius: 10px;
    padding: 32px 30px;
    max-width: 440px;
  }
  label {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }
  input {
    width: 100%;
    background: #fff;
    border: 1px solid rgba(28,37,48,0.22);
    border-radius: 6px;
    color: var(--ink);
    font-size: 15px;
    font-family: inherit;
    padding: 13px 14px;
    margin-bottom: 14px;
  }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(184,68,46,0.12); }
  button {
    width: 100%;
    border: none;
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 14px;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.15s ease;
  }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: 0.5; cursor: wait; }
  .btn-primary { background: var(--ink); color: var(--paper); }
  .btn-primary:hover { background: var(--rule); }
  .btn-secondary { background: transparent; color: var(--ink); border: 1px solid rgba(28,37,48,0.35); }
  .btn-secondary:hover { background: rgba(28,37,48,0.06); }

  .divider {
    display: flex; align-items: center; gap: 12px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.1em;
    margin: 24px 0;
  }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(28,37,48,0.15); }

  .msg { font-size: 13.5px; line-height: 1.5; padding: 12px 14px; border-radius: 6px; margin-bottom: 18px; display: none; }
  .msg.show { display: block; }
  .msg.ok  { background: rgba(63,94,74,0.12);  border: 1px solid rgba(63,94,74,0.4);  color: #2f4736; }
  .msg.err { background: rgba(184,68,46,0.10); border: 1px solid rgba(184,68,46,0.45); color: #8f3120; }

  footer { padding: 22px 0; border-top: 1px solid rgba(28,37,48,0.1); }
  .foot-note {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.1em;
    color: var(--muted);
  }

  @media (max-width: 560px) {
    .wrap { padding: 0 20px; }
    .lede { font-size: 16px; }
    .card { padding: 26px 22px; }
  }
</style>
</head>
<body>
  <nav class="nav">
    <div class="wrap nav-inner">
      <div class="nav-brand"><span class="dot"></span>NSAI for Insurance<span class="nav-sub">&nbsp;: Private Access</span></div>
    </div>
  </nav>

  <main>
    <div class="wrap hero">
      <div class="hero-eyebrow">By invitation only</div>
      <h1>Welcome <em>back</em>.</h1>
      <p class="lede">This site is shared with select partners. Request a sign-in link by email, or enter the access code you were given.</p>

      <div class="card">
        <div id="msg" class="msg"></div>

        <form id="emailForm" autocomplete="on">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@firm.com" required>
          <button type="submit" class="btn-primary" id="emailBtn">Email me a sign-in link</button>
        </form>

        <div class="divider">OR</div>

        <form id="codeForm" autocomplete="off">
          <label for="passcode">Access code</label>
          <input type="password" id="passcode" name="passcode" placeholder="Enter access code">
          <button type="submit" class="btn-secondary" id="codeBtn">Enter</button>
        </form>
      </div>
    </div>
  </main>

  <footer>
    <div class="wrap"><span class="foot-note">NSAI4INSURANCE.COM &middot; APPROVED ACCESS ONLY</span></div>
  </footer>

<script>
  const params = new URLSearchParams(location.search);
  const next = params.get('next') || '/';
  const msg = document.getElementById('msg');

  function show(kind, text) {
    msg.className = 'msg show ' + kind;
    msg.textContent = text;
  }
  if (params.get('error') === 'link') {
    show('err', 'That sign-in link is invalid or has expired. Request a new one below.');
  }

  document.getElementById('emailForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('emailBtn');
    const email = document.getElementById('email').value.trim();
    if (!email) return;
    btn.disabled = true;
    try {
      const r = await fetch('/api/auth/request-link', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, next }),
      });
      const data = await r.json().catch(() => ({}));
      show('ok', data.message || 'If that address is approved, a sign-in link is on its way.');
    } catch (_) {
      show('err', 'Something went wrong. Please try again.');
    } finally {
      btn.disabled = false;
    }
  });

  document.getElementById('codeForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('codeBtn');
    const passcode = document.getElementById('passcode').value;
    if (!passcode) return;
    btn.disabled = true;
    try {
      const r = await fetch('/api/auth/passcode', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ passcode }),
      });
      if (r.ok) {
        location.href = next.startsWith('/') && !next.startsWith('//') ? next : '/';
      } else {
        show('err', 'That access code is not correct.');
        btn.disabled = false;
      }
    } catch (_) {
      show('err', 'Something went wrong. Please try again.');
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
