<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Sign in · NSAI for Insurance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1c2530;
    --paper: #f4efe6;
    --accent-3: #c8a951;
    --muted: rgba(244,239,230,0.55);
    --line: rgba(244,239,230,0.16);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--ink);
    color: var(--paper);
    font-family: 'Inter Tight', system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: rgba(244,239,230,0.03);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 40px 36px;
  }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent-3);
    margin-bottom: 14px;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-size: 30px;
    line-height: 1.1;
    letter-spacing: -0.02em;
    margin: 0 0 8px;
  }
  .sub { color: var(--muted); font-size: 14px; line-height: 1.5; margin-bottom: 28px; }
  label {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }
  input {
    width: 100%;
    background: rgba(0,0,0,0.25);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--paper);
    font-size: 15px;
    font-family: inherit;
    padding: 13px 14px;
    margin-bottom: 14px;
  }
  input:focus { outline: none; border-color: var(--accent-3); }
  button {
    width: 100%;
    background: var(--accent-3);
    color: var(--ink);
    border: none;
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 14px;
    cursor: pointer;
    transition: filter 0.15s ease;
  }
  button:hover { filter: brightness(1.06); }
  button:disabled { opacity: 0.5; cursor: wait; }
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    margin: 26px 0;
  }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--line); }
  .msg { font-size: 13.5px; line-height: 1.5; padding: 12px 14px; border-radius: 6px; margin-bottom: 18px; display: none; }
  .msg.show { display: block; }
  .msg.ok { background: rgba(63,94,74,0.25); border: 1px solid rgba(120,170,130,0.4); color: #d8eada; }
  .msg.err { background: rgba(184,68,46,0.18); border: 1px solid rgba(184,68,46,0.5); color: #f3c4b8; }
  .foot { margin-top: 26px; font-size: 12px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">NSAI for Insurance</div>
    <h1>Sign in</h1>
    <div class="sub">This site is private. Request a sign-in link by email, or enter your access code.</div>

    <div id="msg" class="msg"></div>

    <form id="emailForm" autocomplete="on">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@firm.com" required>
      <button type="submit" id="emailBtn">Email me a sign-in link</button>
    </form>

    <div class="divider">OR</div>

    <form id="codeForm" autocomplete="off">
      <label for="passcode">Access code</label>
      <input type="password" id="passcode" name="passcode" placeholder="Enter access code">
      <button type="submit" id="codeBtn">Enter</button>
    </form>

    <div class="foot">Approved access only.</div>
  </div>

<script>
  const params = new URLSearchParams(location.search);
  const next = params.get('next') || '/';
  const msg = document.getElementById('msg');

  function show(kind, text) {
    msg.className = 'msg show ' + kind;
    msg.textContent = text;
  }
  if (params.get('error') === 'link') {
    show('err', 'That sign-in link is invalid or has expired. Request a new one below.');
  }

  document.getElementById('emailForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('emailBtn');
    const email = document.getElementById('email').value.trim();
    if (!email) return;
    btn.disabled = true;
    try {
      const r = await fetch('/api/auth/request-link', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, next }),
      });
      const data = await r.json().catch(() => ({}));
      show('ok', data.message || 'If that address is approved, a sign-in link is on its way.');
    } catch (_) {
      show('err', 'Something went wrong. Please try again.');
    } finally {
      btn.disabled = false;
    }
  });

  document.getElementById('codeForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('codeBtn');
    const passcode = document.getElementById('passcode').value;
    if (!passcode) return;
    btn.disabled = true;
    try {
      const r = await fetch('/api/auth/passcode', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ passcode }),
      });
      if (r.ok) {
        location.href = next.startsWith('/') && !next.startsWith('//') ? next : '/';
      } else {
        show('err', 'That access code is not correct.');
        btn.disabled = false;
      }
    } catch (_) {
      show('err', 'Something went wrong. Please try again.');
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
